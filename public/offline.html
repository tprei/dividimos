<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FEA101" />
  <title>Dividimos — Sem conexão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F9F9FB;
      color: #1a1d2e;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      text-align: center;
    }
    .brand { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1rem;
      color: #64748b;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: #FEA101;
      color: #1a1d2e;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #E08E00; }
    button:active { background: #C07800; }
    button:focus-visible { outline: 3px solid #1a1d2e; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f1f5f9; }
      p { color: #b8c4d4; }
      button:focus-visible { outline-color: #f1f5f9; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <div class="brand">Dividimos</div>
  <h1>Sem conexão</h1>
  <p>Suas contas continuam aqui quando a internet voltar.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
