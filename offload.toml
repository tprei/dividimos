version = 1

[worker]
memory_mb = 6144
max = 1
egress = ["fonts.googleapis.com", "fonts.gstatic.com"]

[setup]
inputs = ["package.json", "package-lock.json"]
run = ["npm ci --ignore-scripts --no-audit --no-fund"]

[warm]
run = ["npx tsc --noEmit", "npx eslint --max-warnings 0 --cache --cache-strategy content --cache-location node_modules/.cache/eslint/"]

[tasks.check]
timeout = "20m"

[tasks.check.parallel]
typecheck = "npx tsc --noEmit"
lint = "npx eslint --max-warnings 0 --cache --cache-strategy content --cache-location node_modules/.cache/eslint/"
test = "npx vitest run"

[tasks.test]
run = "npx vitest run"
timeout = "20m"

[tasks.build]
run = "npm run build"
timeout = "20m"
env = { NEXT_PUBLIC_SUPABASE_URL = "http://localhost:54321", NEXT_PUBLIC_SUPABASE_ANON_KEY = "build-anon-key", SUPABASE_SERVICE_ROLE_KEY = "build-service-role-key" }

[tasks.soak]
run = "npm run test:soak"
timeout = "60m"
