name: Synthetic Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  PIX_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[1, 2]') || fromJSON('[1, 2, 3]') }}
        total: ${{ github.event_name == 'pull_request' && fromJSON('[2]') || fromJSON('[3]') }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1

      - run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Supabase
        id: supabase
        run: |
          for attempt in 1 2 3; do
            if supabase start -x vector,imgproxy,logflare,edge-runtime; then
              break
            fi
            echo "supabase start failed (attempt $attempt/3), retrying..."
            supabase stop --no-backup 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after 3 attempts" && exit 1
            fi
          done
          STATUS=$(supabase status --output json)
          echo "anon_key=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "service_role_key=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT
          echo "jwt_secret=$(echo "$STATUS" | jq -r '.JWT_SECRET')" >> $GITHUB_OUTPUT

      - name: Cache Next.js build
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build app
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}

      - name: Start server (production)
        if: github.event_name != 'pull_request'
        run: NODE_ENV=test npm run start &
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}

      - name: Start server (Turbopack dev)
        if: github.event_name == 'pull_request'
        run: npx next dev --turbopack &
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "Server did not start in time" && exit 1

      - name: Run synthetic tests
        run: npm run test:synthetic -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          SUPABASE_JWT_SECRET: ${{ steps.supabase.outputs.jwt_secret }}
          E2E_BASE_URL: http://localhost:3000
          DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-test-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
