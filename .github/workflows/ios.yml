name: iOS Build

on:
  pull_request:
    paths:
      - ios/**
      - native-shell/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - scripts/ios-verify-app.sh
      - scripts/ios-verify-release.sh
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      marketing_version:
        description: CFBundleShortVersionString, for example 1.0.0
        required: true
        type: string
      upload:
        description: Upload the verified IPA to App Store Connect for TestFlight
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # PR gate: proves the committed project, shared scheme and Podfile.lock build
  # from a clean checkout. No signing material exists in this job.
  compile:
    name: iOS compiles
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Pinned so a runner image update cannot change the toolchain silently.
      # App Store uploads need the iOS 27 SDK from April 2027. Podfile.lock
      # records the CocoaPods version, so pod install must match it exactly.
      - name: Select Xcode and CocoaPods
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          if [ "$(pod --version)" != "1.17.0" ]; then
            sudo gem install cocoapods -v 1.17.0 --no-document
          fi
          pod --version

      # swift-format ships with the pinned Xcode; ios/.swift-format holds the style.
      - name: Lint Swift
        run: npm run lint:swift

      - run: npm ci --ignore-scripts

      - run: npx cap sync ios

      - name: Reject uncommitted native dependency changes
        run: |
          if ! git diff --exit-code -- ios/App/Podfile ios/App/Podfile.lock ios/App/App.xcodeproj; then
            echo "::error::npx cap sync ios changed committed native files; run it locally and commit the result."
            exit 1
          fi

      - name: Build Release for the simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme Dividimos \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify the built app
        run: scripts/ios-verify-app.sh build/ios/Build/Products/Release-iphonesimulator/App.app

  # Signed release: runs only when a maintainer dispatches it from main, and
  # only after the ios-release environment's required reviewers approve. The
  # signing secrets live in that environment, so pull requests never see them.
  release:
    name: Signed archive and TestFlight upload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-release
    env:
      # A re-run of a job whose upload already reached App Store Connect would
      # reuse the build number and be rejected, so each attempt gets its own.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Same toolchain as the compile job, so the drift check below compares
      # against a Podfile.lock written by the same CocoaPods version.
      - name: Select Xcode and CocoaPods
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          if [ "$(pod --version)" != "1.17.0" ]; then
            sudo gem install cocoapods -v 1.17.0 --no-document
          fi
          pod --version

      - name: Check release configuration
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          APPLE_APP_ID_PREFIX: ${{ vars.APPLE_APP_ID_PREFIX }}
          IOS_GOOGLE_URL_SCHEME: ${{ vars.IOS_GOOGLE_URL_SCHEME }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_TEAM_ID APPLE_APP_ID_PREFIX IOS_GOOGLE_URL_SCHEME \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; a release cannot ship without it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::marketing_version '$MARKETING_VERSION' is not MAJOR.MINOR.PATCH."
            exit 1
          }
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::IOS_TEAM_ID is malformed."; exit 1; }
          [[ "$APPLE_APP_ID_PREFIX" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_APP_ID_PREFIX is malformed."; exit 1; }
          [[ "$IOS_GOOGLE_URL_SCHEME" =~ ^com\.googleusercontent\.apps\.[0-9]+-[a-z0-9]+$ ]] || {
            echo "::error::IOS_GOOGLE_URL_SCHEME is not a reversed iOS OAuth client id."
            exit 1
          }
          # The project must still read the variables this job sets; if they
          # moved, the archive would silently use development values.
          for setting in DIVIDIMOS_TEAM_ID DIVIDIMOS_PROVISIONING_PROFILE GOOGLE_IOS_URL_SCHEME; do
            grep -q "$setting" ios/App/App.xcodeproj/project.pbxproj || {
              echo "::error::project.pbxproj no longer reads $setting."
              exit 1
            }
          done
          grep -q DIVIDIMOS_REQUIRE_FIREBASE ios/App/copy-firebase-config.sh || {
            echo "::error::copy-firebase-config.sh no longer enforces DIVIDIMOS_REQUIRE_FIREBASE."
            exit 1
          }

      - run: npm ci --ignore-scripts

      - name: Inject GoogleService-Info.plist for FCM
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          TARGET=ios/App/App/GoogleService-Info.plist
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > "$TARGET" || {
            echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is not valid base64."
            exit 1
          }
          plutil -lint "$TARGET" >/dev/null || {
            echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 did not decode to a plist."
            exit 1
          }
          [ "$(plutil -extract BUNDLE_ID raw -o - "$TARGET")" = "ai.dividimos.app" ] || {
            echo "::error::GoogleService-Info.plist is not for ai.dividimos.app."
            exit 1
          }

      - run: npx cap sync ios

      - name: Reject uncommitted native dependency changes
        run: |
          if ! git diff --exit-code -- ios/App/Podfile ios/App/Podfile.lock ios/App/App.xcodeproj; then
            echo "::error::npx cap sync ios changed committed native files."
            exit 1
          fi

      - name: Install signing material in an ephemeral keychain
        id: signing
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dividimos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE="$RUNNER_TEMP/distribution.p12"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -f pkcs12 -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERTIFICATE"

          mkdir -p "$PROFILE_DIR"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST")"
          PROFILE_TEAM="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")"
          [ "$PROFILE_TEAM" = "$IOS_TEAM_ID" ] || {
            echo "::error::the provisioning profile belongs to team $PROFILE_TEAM, not IOS_TEAM_ID."
            exit 1
          }
          # Development and ad hoc profiles list devices; enterprise profiles
          # provision all devices. Only an App Store profile carries neither.
          if plutil -extract ProvisionedDevices xml1 -o - "$PROFILE_PLIST" >/dev/null 2>&1 \
            || plutil -extract ProvisionsAllDevices xml1 -o - "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::error::the provisioning profile is not an App Store distribution profile."
            exit 1
          fi
          mv "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          rm -f "$PROFILE_PLIST"

          {
            echo "keychain=$KEYCHAIN"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_path=$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          } >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_GOOGLE_URL_SCHEME: ${{ vars.IOS_GOOGLE_URL_SCHEME }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme Dividimos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dividimos.xcarchive" \
            DIVIDIMOS_TEAM_ID="$IOS_TEAM_ID" \
            DIVIDIMOS_PROVISIONING_PROFILE="$PROFILE_UUID" \
            DIVIDIMOS_REQUIRE_FIREBASE=YES \
            GOOGLE_IOS_URL_SCHEME="$IOS_GOOGLE_URL_SCHEME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive

      - name: Export the App Store IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTIONS"
          plutil -insert method -string app-store-connect "$OPTIONS"
          plutil -insert destination -string export "$OPTIONS"
          plutil -insert teamID -string "$IOS_TEAM_ID" "$OPTIONS"
          plutil -insert signingStyle -string manual "$OPTIONS"
          plutil -insert signingCertificate -string "Apple Distribution" "$OPTIONS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$OPTIONS"
          plutil -insert uploadSymbols -bool YES "$OPTIONS"
          plutil -insert provisioningProfiles -dictionary "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:ai.dividimos.app string $PROFILE_UUID" "$OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dividimos.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify the exported IPA
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          APPLE_APP_ID_PREFIX: ${{ vars.APPLE_APP_ID_PREFIX }}
        run: scripts/ios-verify-release.sh "$RUNNER_TEMP/export/Dividimos.ipa" "$MARKETING_VERSION" "$BUILD_NUMBER" "$IOS_TEAM_ID" "$APPLE_APP_ID_PREFIX"

      - name: Validate and upload to App Store Connect
        if: inputs.upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          xcrun altool --validate-app "$RUNNER_TEMP/export/Dividimos.ipa" \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --p8-file-path "$KEY"
          xcrun altool --upload-package "$RUNNER_TEMP/export/Dividimos.ipa" \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --p8-file-path "$KEY" \
            --wait

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dividimos-ios-${{ inputs.marketing_version }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/Dividimos.ipa
          retention-days: 7
          overwrite: true

      - name: Remove signing material
        if: always()
        env:
          PROFILE_PATH: ${{ steps.signing.outputs.profile_path }}
        run: |
          # The keychain path is fixed rather than read from the signing step's
          # outputs, so a failure halfway through that step still deletes it.
          KEYCHAIN="$RUNNER_TEMP/dividimos-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
          if [ -n "$PROFILE_PATH" ]; then
            rm -f "$PROFILE_PATH"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP"/AuthKey_*.p8 ios/App/App/GoogleService-Info.plist
