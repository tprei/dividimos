name: Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schemas/**'
      - 'scripts/build-baseline.sh'
      - 'scripts/check-migration-history.mjs'
      - '.github/workflows/migrations.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Replay on fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1

      - name: Start Supabase (applies every migration in order)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              break
            fi
            echo "supabase start failed (attempt $attempt/3), retrying..."
            supabase stop --no-backup 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after 3 attempts" && exit 1
            fi
          done

      - name: Reset and replay migrations
        run: supabase db reset --local

  baseline-freshness:
    name: Baseline matches supabase/schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Regenerate the baseline and diff it
        run: |
          BASELINE=supabase/migrations/20260906000000_ledger_baseline.sql
          if ! git ls-files --error-unmatch "$BASELINE" >/dev/null 2>&1; then
            echo "::error::$BASELINE is not tracked; the baseline must be committed."
            exit 1
          fi
          ./scripts/build-baseline.sh
          if [ ! -f "$BASELINE" ]; then
            echo "::error::the generator did not produce $BASELINE."
            exit 1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard -- supabase/migrations)
          if ! git diff --quiet -- supabase/migrations || [ -n "$UNTRACKED" ]; then
            echo "::error::supabase/migrations does not match supabase/schemas."
            git diff --stat -- supabase/migrations
            if [ -n "$UNTRACKED" ]; then
              echo "Untracked generated migrations:"
              echo "$UNTRACKED"
            fi
            echo ""
            echo "Fix: run ./scripts/build-baseline.sh and commit the result."
            exit 1
          fi
          echo "OK: baseline matches supabase/schemas."

  migration-history:
    name: No unauthorized renamed or deleted migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Reject unauthorized renames or deletions under supabase/migrations
        run: |
          node scripts/check-migration-history.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "$(git rev-parse HEAD)"
