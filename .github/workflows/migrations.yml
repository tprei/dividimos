name: Migrations

# No path filter: a required check that never runs on a PR leaves branch
# protection waiting forever, so every PR reports these contexts and the SQL
# jobs skip themselves when no SQL changed.
on:
  pull_request:


permissions:
  contents: read

jobs:
  changes:
    name: Detect SQL changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only "$merge_base" HEAD -- \
              supabase scripts/build-baseline.sh \
              scripts/check-database-invariants.mjs \
              scripts/check-migration-history.mjs \
              scripts/check-migration-history.test.mjs \
              scripts/verify-migrations.mjs \
              scripts/verify-migrations.test.mjs \
              src/test/integration-setup.ts \
              src/test/db-race-barrier.ts \
              src/types/database.ts \
              vitest.integration.config.mts \
              package.json package-lock.json \
              .github/workflows/ \
              | grep -q .; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
          fi

  verify-fresh:
    name: Verify fresh catalog (HEAD migrations)
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR base ref as data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "+${BASE_SHA}:refs/remotes/pr/base"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.20.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Replay HEAD migrations and capture the catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/verify-migrations.mjs fresh \
            --base "refs/remotes/pr/base" --head HEAD \
            --artifacts verify-artifacts/fresh --keep

      - name: Generated database types match HEAD's database
        run: |
          DB_URL=$(jq -r .db_url verify-artifacts/fresh/env.json)
          supabase gen types typescript --db-url "$DB_URL" \
            > src/types/database.ts
          if ! git diff --quiet -- src/types/database.ts; then
            echo "::error::src/types/database.ts does not match the database HEAD's migrations build."
            git diff --stat -- src/types/database.ts
            exit 1
          fi

      - name: Assert database security invariants on the fresh database
        run: node scripts/check-database-invariants.mjs \
            "$(jq -r .db_url verify-artifacts/fresh/env.json)"

      - name: Stop the fresh project
        if: always()
        run: |
          if [ -f verify-artifacts/fresh/project-dir.txt ]; then
            supabase stop --no-backup \
              --workdir "$(cat verify-artifacts/fresh/project-dir.txt)"
          fi

      - name: Upload fresh verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-fresh
          # env.json carries local service credentials; artifacts carry
          # only the reviewable catalog.
          path: verify-artifacts/fresh/catalog.json
          retention-days: 7

  verify-upgrade:
    name: Verify populated upgrade (base + new migrations)
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR base ref as data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "+${BASE_SHA}:refs/remotes/pr/base"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.20.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Upgrade a populated base database with HEAD's new migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/verify-migrations.mjs upgrade \
            --base "refs/remotes/pr/base" --head HEAD \
            --artifacts verify-artifacts/upgrade --keep


      - name: Export the upgraded project endpoints
        run: |
          {
            echo "UPGRADE_API_URL=$(jq -r .api_url verify-artifacts/upgrade/env.json)"
            echo "UPGRADE_ANON_KEY=$(jq -r .anon_key verify-artifacts/upgrade/env.json)"
            echo "UPGRADE_SERVICE_KEY=$(jq -r .service_role_key verify-artifacts/upgrade/env.json)"
            echo "UPGRADE_DB_URL=$(jq -r .db_url verify-artifacts/upgrade/env.json)"
          } >> "$GITHUB_ENV"

      - name: Run the integration contract suite on the upgraded database
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.UPGRADE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.UPGRADE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.UPGRADE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ env.UPGRADE_DB_URL }}
          PIX_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          RATE_LIMIT_DISABLED: "0"
          INTEGRATION_STRICT: "1"

      - name: Stop the upgraded project
        if: always()
        run: |
          if [ -f verify-artifacts/upgrade/project-dir.txt ]; then
            supabase stop --no-backup \
              --workdir "$(cat verify-artifacts/upgrade/project-dir.txt)"
          fi

      - name: Assert database security invariants on the upgraded database
        run: node scripts/check-database-invariants.mjs "$UPGRADE_DB_URL"

      - name: Upload upgrade verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-upgrade
          # env.json carries local service credentials; artifacts carry
          # only the reviewable catalog and observations.
          path: |
            verify-artifacts/upgrade/catalog.json
            verify-artifacts/upgrade/observations.json
          retention-days: 7

  verify-parity:
    name: Fresh and upgraded catalogs are identical
    needs: [verify-fresh, verify-upgrade]
    if: always() && needs.verify-fresh.result == 'success' && needs.verify-upgrade.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: verification-fresh
          path: fresh

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: verification-upgrade
          path: upgrade

      - run: node scripts/verify-migrations.mjs compare \
            --expected fresh/catalog.json --actual upgrade/catalog.json

  replay:
    name: Replay on fresh database
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Same version as the devDependency, so local and CI run one CLI.
          version: 2.20.3

      - name: Assert pinned Supabase CLI
        run: |
          actual=$(supabase --version | tr -d 'v \r\n')
          if [ "$actual" != "2.20.3" ]; then
            echo "::error::Supabase CLI $actual, expected 2.20.3"
            exit 1
          fi

      - name: Start Supabase (applies every migration in order)
        run: |
          for attempt in 1 2 3; do
            if timeout 8m supabase start; then
              break
            fi
            echo "supabase start failed (attempt $attempt/3), retrying..."
            supabase stop --no-backup 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after 3 attempts" && exit 1
            fi
          done

      - name: Reset and replay migrations
        run: supabase db reset --local

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Reads the effective schema the migrations just produced, rather than
      # trusting what the SQL says it did.
      - name: Assert database security invariants
        run: |
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          node scripts/check-database-invariants.mjs "$DB_URL"

  declaration-parity:
    name: Declared schemas match forward migrations
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Same version as the devDependency, so local and CI run one CLI.
          version: 2.20.3

      - name: Assert pinned Supabase CLI
        run: |
          actual=$(supabase --version | tr -d 'v \r\n')
          if [ "$actual" != "2.20.3" ]; then
            echo "::error::Supabase CLI $actual, expected 2.20.3"
            exit 1
          fi

      - name: Replay migrations before declaration parity
        run: |
          for attempt in 1 2 3; do
            if timeout 8m supabase start; then
              break
            fi
            echo "supabase start failed (attempt $attempt/3), retrying..."
            supabase stop --no-backup 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after 3 attempts" && exit 1
            fi
          done
          supabase db reset --local

      - name: Stop the database before comparing declarations
        run: supabase stop --no-backup

      - name: Require an empty declaration diff
        run: |
          set +e
          supabase db diff > declaration-diff.sql 2> declaration-diff.stderr
          status=$?
          set -e
          cat declaration-diff.stderr >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::supabase db diff failed with status $status."
            exit "$status"
          fi
          if [ -n "$(tr -d '[:space:]' < declaration-diff.sql)" ]; then
            echo "::error::declared schemas differ from the applied forward migrations."
            cat declaration-diff.sql
            exit 1
          fi
          echo "OK: declared schemas match forward migrations."

  baseline-freshness:
    name: Schema snapshot matches supabase/schemas
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Regenerate the schema snapshot and diff it
        run: |
          SNAPSHOT=supabase/schema.sql
          if ! git ls-files --error-unmatch "$SNAPSHOT" >/dev/null 2>&1; then
            echo "::error::$SNAPSHOT is not tracked; the schema snapshot must be committed."
            exit 1
          fi
          ./scripts/build-baseline.sh
          if [ ! -f "$SNAPSHOT" ]; then
            echo "::error::the generator did not produce $SNAPSHOT."
            exit 1
          fi
          if ! git diff --quiet -- "$SNAPSHOT"; then
            echo "::error::$SNAPSHOT does not match supabase/schemas."
            git diff --stat -- "$SNAPSHOT"
            echo ""
            echo "Fix: run ./scripts/build-baseline.sh and commit the result."
            exit 1
          fi
          echo "OK: schema snapshot matches supabase/schemas."
