name: Ambient Synthetic

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      experimental:
        description: "Also run the experimental ambient probes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ambient-prod
  cancel-in-progress: false

jobs:
  ambient:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      AMBIENT_SUPABASE_URL: ${{ secrets.AMBIENT_SUPABASE_URL }}
      AMBIENT_SUPABASE_ANON_KEY: ${{ secrets.AMBIENT_SUPABASE_ANON_KEY }}
      AMBIENT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AMBIENT_SUPABASE_SERVICE_ROLE_KEY }}
      AMBIENT_SUPABASE_JWT_SECRET: ${{ secrets.AMBIENT_SUPABASE_JWT_SECRET }}
      AMBIENT_BASE_URL: ${{ vars.AMBIENT_BASE_URL }}
      AMBIENT_GOOGLE_CLIENT_ID: ${{ vars.AMBIENT_GOOGLE_CLIENT_ID }}

    steps:
      # Until the AMBIENT_* secrets and variables exist, the run is a config
      # gap, not a production failure: end green with a notice and never
      # reach the reporter, which would otherwise open a synthetic-prod issue.
      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in AMBIENT_SUPABASE_URL AMBIENT_SUPABASE_ANON_KEY AMBIENT_SUPABASE_SERVICE_ROLE_KEY AMBIENT_SUPABASE_JWT_SECRET AMBIENT_BASE_URL AMBIENT_GOOGLE_CLIENT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::ambient not configured; missing:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
        if: ${{ steps.config.outputs.configured == 'true' }}

      - name: Probes and troupe
        id: vitest
        if: ${{ steps.config.outputs.configured == 'true' }}
        timeout-minutes: 6
        run: npm run test:ambient

      # The later steps run even when vitest failed so one run reports every
      # failure at once. Nothing is marked continue-on-error: a failed step
      # still fails the job.
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cache hit)
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      # The realtime freshness probe joined the walk in this step: two
      # 90s tests with one retry each no longer fit the old 4-minute budget.
      # Experimental probes (dark legibility, identity) only run when the
      # dispatch input asks for them; the schedule never enables them.
      - name: Web smoke
        id: web
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        timeout-minutes: 7
        env:
          AMBIENT_EXPERIMENTAL: ${{ inputs.experimental == true && '1' || '' }}
        run: npm run test:ambient:web

      # Playwright records the phone walk as webm; Telegram wants h264 mp4.
      # A run that never reached the browser simply has nothing to encode.
      - name: Encode the run recording
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        run: |
          recording=$(find test-results -name '*.webm' -print -quit 2>/dev/null || true)
          if [ -z "$recording" ]; then
            echo "::notice::no recording to encode"
            exit 0
          fi
          # ubuntu-latest carries no ffmpeg, so the encode used to exit 127
          # with a recording in hand (run 35397827193).
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -y -loglevel error -i "$recording" \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart \
            ambient-video.mp4
          ls -l ambient-video.mp4

      - name: Upload the run media
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ambient-media
          path: |
            ambient-shots
            ambient-video.mp4
            ambient-diary.txt
            test-results/**/*.webm
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Ensure synthetic-prod label
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh label create synthetic-prod --description "Ambient production synthetic" --color B60205 --force

      - name: Report
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: node scripts/ambient/report.mjs
