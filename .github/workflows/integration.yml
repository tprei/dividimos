name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Same version as the devDependency, so local and CI run one CLI.
          version: 2.20.3

      - name: Assert pinned Supabase CLI
        run: |
          actual=$(supabase --version | tr -d 'v \r\n')
          if [ "$actual" != "2.20.3" ]; then
            echo "::error::Supabase CLI $actual, expected 2.20.3"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Start Supabase
        id: supabase
        run: |
          for attempt in 1 2 3; do
            if timeout 8m supabase start; then
              break
            fi
            echo "supabase start failed (attempt $attempt/3), retrying..."
            supabase stop --no-backup 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after 3 attempts" && exit 1
            fi
          done
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          echo "anon_key=${ANON_KEY}" >> $GITHUB_OUTPUT
          echo "service_role_key=${SERVICE_ROLE_KEY}" >> $GITHUB_OUTPUT
          echo "db_url=${DB_URL}" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          PIX_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPABASE_DB_URL: ${{ steps.supabase.outputs.db_url }}
          RATE_LIMIT_DISABLED: "0"
