name: Migration History

# pull_request_target runs the base branch's copy of this workflow, which for
# a stacked PR is an unmerged parent. Nothing from the parent or the PR head
# is therefore executed: after fetching the candidate refs as git objects, the
# working tree is detached at the exact commit that origin/main resolved to at
# run time, and only that immutable, trusted commit's checker runs. The PR
# base and head are read with plumbing commands only; no path filter is used
# so every PR reports this context. `edited` covers base retargets.
#
# Residual risk this cannot remove: the workflow definition itself comes from
# the base ref, and an unmerged parent is contributor-controlled, so a
# rewritten parent file could fake this check green. The push-triggered
# post-merge job below re-verifies every merge from main's own trusted copy,
# so a faked gate cannot survive the merge that relied on it, and workflow
# diffs get human review either way.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# pull_request_target reads this block from the base branch's copy, so the
# cancellation only takes effect once this file is merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  migration-history:
    if: github.event_name == 'pull_request_target'
    name: No unauthorized changes to applied migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR base (git objects only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The head's history contains the PR base tip for stacked PRs, so
          # the base tree is inspectable without executing or checking out
          # either candidate ref.
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Pin the working tree to one immutable main commit
        run: |
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          # FETCH_HEAD is the commit origin/main answered with for this run;
          # detaching makes every later command execute from that exact,
          # immutable commit rather than a mutable branch name. The reset
          # manifest, if one is ever authorized, is read from this commit.
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          git checkout --detach "$MAIN_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check migration history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A label is authorization a PR author without write access cannot
          # grant themselves.
          CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'trusted-ci-change') }}
        run: |
          if [ "$CI_LABEL" = "true" ]; then
            node scripts/check-migration-history.mjs \
              "$BASE_SHA" refs/remotes/pr/head \
              --trusted-main "$MAIN_SHA" --allow-ci-changes
          else
            node scripts/check-migration-history.mjs \
              "$BASE_SHA" refs/remotes/pr/head --trusted-main "$MAIN_SHA"
          fi

  post-merge-history:
    if: github.event_name == 'push'
    name: Merged main keeps applied migrations intact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Read the merged PR's authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR-side gate trusts the 'trusted-ci-change' label, which only
          # a maintainer can grant. The merged PR keeps that label, so the
          # post-merge re-verification reads the same authorization instead
          # of failing every merge that legitimately touched CI files.
          # curl -f keeps this fail-closed: an API error blocks the merge
          # status rather than silently widening it.
          LABELLED="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | jq 'any(.[]; [.labels[]?.name] | index("trusted-ci-change"))')"
          echo "ALLOW_CI_CHANGES=$LABELLED" >> "$GITHUB_ENV"

      - name: Re-verify the merge from main's own trusted copy
        run: |
          BEFORE="$(git rev-parse HEAD~1)"
          if [ "$ALLOW_CI_CHANGES" = "true" ]; then
            node scripts/check-migration-history.mjs \
              "$BEFORE" HEAD --trusted-main HEAD --allow-ci-changes
          else
            node scripts/check-migration-history.mjs \
              "$BEFORE" HEAD --trusted-main HEAD
          fi
