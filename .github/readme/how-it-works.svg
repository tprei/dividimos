<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hiw-title hiw-desc">
  <title id="hiw-title">Como funciona o Dividimos</title>
  <desc id="hiw-desc">Três passos. 1, Escaneie: tira uma foto do cupom e os itens aparecem na hora. 2, Atribua: cada um marca o que comeu e o app calcula quem deve o quê. 3, Pague: QR Code Pix com o valor certinho, pago no app do banco e registrado no Dividimos.</desc>
